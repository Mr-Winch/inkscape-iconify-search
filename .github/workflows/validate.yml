name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q icon_importer icon_importer_extension.py
      - name: Build release package and checksum
        shell: pwsh
        run: python tools/package_extension.py
      - name: Verify package checksum
        shell: pwsh
        run: |
          $archive = Get-Item dist\inkscape-iconify-search-v0.6.3.zip
          $expected = (Get-Content "$($archive.FullName).sha256").Split()[0]
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch" }
